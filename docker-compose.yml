services:
  api-usage-monitor:
    build: .
    container_name: api_usage_monitor
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "23098:8080"
    environment:
      - PORT=8080
      - REFRESH_INTERVAL=15  # minutes
    volumes:
      # Persist all data (NAS path: /volume6/docker/API_Usage)
      # Contains: .env, usage_history.json
      - /volume6/docker/API_Usage:/app/data
    healthcheck:
      # Must stay in sync with the HEALTHCHECK in Dockerfile: a healthcheck
      # defined here overrides the image's own, and the image has no curl.
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/api/status', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
