# Public, deployment-neutral compose file.
#
# Everything here is variable-driven with sane defaults, so `docker compose up
# -d --build` works on a freshly cloned repo with no edits at all.
#
# ⚠️ DO NOT edit this file to add your private deployment details.
# Host paths, resource limits, image tags and secrets belong in a
# `docker-compose.override.yml` next to this file (git-ignored), which Compose
# merges automatically. That keeps `git pull` conflict-free.
#
# Variables (put them in a `.env` beside this file, or export them):
#   DATA_DIR   host directory for .env + usage_history.json   (default ./data)
#   HOST_PORT  port published on the host                     (default 8080)
#   TZ         container timezone                             (default UTC)
services:
  api-usage-monitor:
    build: .
    container_name: api_usage_monitor
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # Port INSIDE the container. Leave this alone; change HOST_PORT instead.
      - PORT=8080
      - REFRESH_INTERVAL=${REFRESH_INTERVAL:-15}  # minutes
      - TZ=${TZ:-UTC}
    volumes:
      # Persists .env and usage_history.json.
      - ${DATA_DIR:-./data}:/app/data
    healthcheck:
      # Must stay in sync with the HEALTHCHECK in Dockerfile: a healthcheck
      # defined here overrides the image's own, and the image has no curl.
      # Port is read from the container's own PORT env at runtime.
      test: ["CMD", "python3", "-c",
             "import os,urllib.request,sys; p=os.environ.get('PORT','8080'); sys.exit(0 if urllib.request.urlopen('http://localhost:'+p+'/api/status', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
