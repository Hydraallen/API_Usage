<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZhipuAI Coding Plan 使用量监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header .subtitle {
            color: #888;
            font-size: 1rem;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .status-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .status-item .dot.online { background: #22c55e; }
        .status-item .dot.offline { background: #ef4444; }
        .status-item .dot.refreshing { background: #f59e0b; animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .refresh-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .refresh-btn .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .countdown {
            color: #f59e0b;
            font-weight: 600;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .card-icon.quota { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .card-icon.model { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .card-icon.tool { background: linear-gradient(135deg, #10b981, #059669); }
        .card-icon.api { background: linear-gradient(135deg, #f59e0b, #d97706); }

        .card-title h2 {
            font-size: 1.1rem;
            color: #fff;
        }

        .card-title span {
            font-size: 0.85rem;
            color: #888;
        }

        .quota-item {
            margin-bottom: 20px;
        }

        .quota-item:last-child {
            margin-bottom: 0;
        }

        .quota-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .quota-label .name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quota-label .percentage {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .progress-bar {
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        .progress-fill.low { background: linear-gradient(90deg, #22c55e, #16a34a); }
        .progress-fill.medium { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .progress-fill.high { background: linear-gradient(90deg, #ef4444, #dc2626); }

        .quota-meta {
            font-size: 0.85rem;
            color: #888;
            display: flex;
            justify-content: space-between;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-value.blue { color: #3b82f6; }
        .stat-value.purple { color: #8b5cf6; }
        .stat-value.green { color: #10b981; }
        .stat-value.orange { color: #f59e0b; }

        .stat-label {
            font-size: 0.85rem;
            color: #888;
        }

        .tool-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tool-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }

        .tool-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tool-name .icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .tool-count {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .history-section {
            margin-top: 30px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .history-header h2 {
            font-size: 1.5rem;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chart {
            position: relative;
            height: 200px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding-top: 20px;
        }

        .chart-bar {
            flex: 1;
            background: linear-gradient(180deg, #3b82f6, #1d4ed8);
            border-radius: 4px 4px 0 0;
            position: relative;
            min-height: 4px;
            transition: height 0.3s ease;
        }

        .chart-bar:hover {
            opacity: 0.8;
        }

        .chart-bar::after {
            content: attr(data-value);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: #888;
            white-space: nowrap;
        }

        .chart-labels {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .chart-labels span {
            flex: 1;
            text-align: center;
            font-size: 0.75rem;
            color: #666;
        }

        /* --- dual-axis trend chart --------------------------------------- */
        .chart-wrap {
            display: grid;
            grid-template-columns: 60px 1fr 60px;
            gap: 10px;
        }

        .chart-axis {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-top: 20px;
            font-size: 0.7rem;
            color: #777;
        }

        .chart-axis.right {
            text-align: right;
        }

        .chart-axis .axis-title {
            font-size: 0.65rem;
            color: #999;
            line-height: 1.3;
        }

        .chart-line-svg {
            position: absolute;
            left: 0;
            right: 0;
            top: 20px;
            bottom: 0;
            width: 100%;
            height: calc(100% - 20px);
            pointer-events: none;
            overflow: visible;
        }

        .chart-bar.missing {
            background: repeating-linear-gradient(45deg,
                rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.10) 4px,
                transparent 4px, transparent 8px);
            min-height: 4px;
        }

        .chart-bar.missing::after {
            content: '';
        }

        .chart-legend {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 0.75rem;
            color: #888;
            margin-top: 12px;
        }

        .chart-legend .swatch {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: -1px;
        }

        .chart-legend .swatch.bar { background: linear-gradient(180deg, #3b82f6, #1d4ed8); }
        .chart-legend .swatch.line { background: #f59e0b; }
        .chart-legend .swatch.missing {
            background: repeating-linear-gradient(45deg,
                rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.25) 3px,
                transparent 3px, transparent 6px);
        }

        /* --- live balance freshness badge --------------------------------- */
        .freshness {
            margin-left: auto;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .freshness.loading { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border-color: rgba(148, 163, 184, 0.3); }
        .freshness.fresh   { background: rgba(34, 197, 94, 0.15);  color: #4ade80; border-color: rgba(34, 197, 94, 0.35); }
        .freshness.stale   { background: rgba(234, 179, 8, 0.15);  color: #facc15; border-color: rgba(234, 179, 8, 0.35); }
        .freshness.error   { background: rgba(239, 68, 68, 0.18);  color: #f87171; border-color: rgba(239, 68, 68, 0.45); }

        .quota-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            word-break: break-all;
        }

        .api-status {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .api-test {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }

        .api-test .label {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge.success { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .badge.error { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        .error-message {
            text-align: center;
            padding: 60px 20px;
        }

        .error-message h2 {
            color: #ef4444;
            margin-bottom: 16px;
        }

        .error-message p {
            color: #888;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .loading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #666;
            font-size: 0.9rem;
        }

        /* --- multi-user: overview table + user switcher -------------------- */
        .overview {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 20px;
            margin-bottom: 20px;
        }

        .overview h2 {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 12px;
        }

        .overview-scroll {
            overflow-x: auto;
        }

        .overview table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .overview th,
        .overview td {
            padding: 10px 12px;
            text-align: right;
            white-space: nowrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .overview th:first-child,
        .overview td:first-child {
            text-align: left;
        }

        .overview th {
            color: #888;
            font-weight: 500;
            font-size: 0.8rem;
        }

        .overview tbody tr {
            cursor: pointer;
            transition: background 0.15s;
        }

        .overview tbody tr:hover { background: rgba(255, 255, 255, 0.04); }
        .overview tbody tr.active { background: rgba(59, 130, 246, 0.15); }
        .overview tbody tr:last-child td { border-bottom: none; }

        .overview .pct.low { color: #22c55e; }
        .overview .pct.medium { color: #f59e0b; }
        .overview .pct.high { color: #ef4444; }
        .overview .muted { color: #666; }
        .overview .row-error { color: #f87171; font-size: 0.8rem; margin-left: 6px; }

        .user-tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .user-tab {
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .user-tab:hover { border-color: rgba(59, 130, 246, 0.6); }

        .user-tab.active {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-color: transparent;
            color: #fff;
        }

        .user-tab .tab-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            background: #22c55e;
        }

        .user-tab .tab-dot.bad { background: #ef4444; }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .status-bar {
                gap: 10px;
            }

            .status-item {
                padding: 8px 12px;
                font-size: 0.85rem;
            }

            body {
                padding: 12px;
            }

            .overview {
                padding: 12px;
            }

            .overview th,
            .overview td {
                padding: 8px 6px;
                font-size: 0.8rem;
            }

            .overview .hide-mobile,
            .overview .row-error .err-text {
                display: none;
            }

            /* 20 bars must fit ~300px: drop per-bar values, thin the labels */
            .chart-wrap {
                grid-template-columns: 40px minmax(0, 1fr) 40px;
                gap: 4px;
            }

            .chart,
            .chart-labels {
                gap: 2px;
            }

            .chart-bar::after {
                display: none;
            }

            .chart-labels span {
                min-width: 0;
                overflow: visible;
                font-size: 0.6rem;
                visibility: hidden;
            }

            .chart-labels span:nth-child(4n+1) {
                visibility: visible;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 ZhipuAI Coding Plan</h1>
            <p class="subtitle">实时使用量监控面板</p>
        </header>

        <section class="overview" id="overview" style="display:none">
            <h2>👥 用户总览</h2>
            <div class="overview-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>用户</th>
                            <th>5h 配额</th>
                            <th>周配额</th>
                            <th>24h Tokens</th>
                            <th class="hide-mobile">等级</th>
                            <th class="hide-mobile">最近采集 (UTC+8)</th>
                        </tr>
                    </thead>
                    <tbody id="overview-body"></tbody>
                </table>
            </div>
        </section>

        <div class="user-tabs" id="user-tabs" style="display:none"></div>

        <div class="status-bar">
            <div class="status-item">
                <span class="dot" id="status-dot"></span>
                <span id="status-text">加载中...</span>
            </div>
            <div class="status-item">
                <span>📅</span>
                <span title="北京时间 (UTC+8)">上次更新: <strong id="last-update">--</strong></span>
            </div>
            <div class="status-item">
                <span>⏰</span>
                <span>下次更新: <strong class="countdown" id="countdown">--</strong></span>
            </div>
            <div class="status-item">
                <span>🏷️</span>
                <span>账户等级: <strong id="account-level">--</strong></span>
            </div>
            <button class="refresh-btn" id="refresh-btn" onclick="forceRefresh()">
                <span id="refresh-icon">🔄</span>
                <span>强制更新</span>
            </button>
        </div>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>正在加载数据...</p>
            </div>
        </div>

        <footer>
            <p>ZhipuAI Usage Monitor © 2026 | 自动刷新间隔: <span id="refresh-interval">15</span> 分钟 | 时间均为北京时间 (UTC+8)</p>
        </footer>
    </div>

    <script>
        // Configuration
        const API_BASE = '';  // Same origin
        const JSON_FILE = 'usage_history.json';
        const REFRESH_INTERVAL = 60000; // 60秒页面刷新

        // State
        let lastUpdateTime = null;
        let nextUpdateTime = null;
        let refreshIntervalMinutes = 15;
        let isRefreshing = false;
        let countdownTimer = null;

        // Check if we're running with server API
        // Server API is only available when running server.py, not with simple http.server
        let hasServerAPI = false;

        // Live quota state (the /api/quota/live path — this is what makes the
        // page fresh; the 15-minute scheduler only feeds the trend chart).
        // liveQuota shape mirrors the server contract:
        //   { ok, cached, age_seconds, ttl_seconds, fetched_at, data, error }
        let liveQuota = null;          // last successful live payload
        let liveQuotaError = null;     // last error string
        let liveQuotaFetchedAt = null; // client-side Date of that fetch
        let liveQuotaLoading = true;
        let contentRendered = false;
        let freshnessTimer = null;

        // Multi-user state. currentUser is mirrored into the URL (?user=) so a
        // reload or a shared link lands on the same user. viewGen is bumped on
        // every switch; responses for an older view are dropped on arrival so
        // a slow request for user A can never paint over user B.
        let users = [];            // [{ name, is_default }]
        let currentUser = null;
        let viewGen = 0;
        let overviewRows = [];
        let lastStatus = null;     // last /api/status body for currentUser

        // Build an API URL for the current user.
        function apiUrl(path, extra) {
            const params = new URLSearchParams(extra || {});
            if (currentUser) params.set('user', currentUser);
            const qs = params.toString();
            return `${API_BASE}${path}${qs ? '?' + qs : ''}`;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // Detect server API availability
        async function detectServerAPI() {
            try {
                const response = await fetch(`${API_BASE}/api/status`, { 
                    method: 'GET',
                    signal: AbortSignal.timeout(2000)
                });
                hasServerAPI = response.ok;
            } catch (e) {
                hasServerAPI = false;
            }
        }

        // Format number — must never throw on undefined/null/NaN, otherwise a
        // single missing field takes the whole page down.
        function formatNumber(num) {
            if (num === null || num === undefined) return '--';
            const n = typeof num === 'number' ? num : Number(num);
            if (!isFinite(n)) return '--';
            const sign = n < 0 ? '-' : '';
            const a = Math.abs(n);
            if (a >= 1000000) return sign + (a / 1000000).toFixed(1) + 'M';
            if (a >= 1000) return sign + (a / 1000).toFixed(1) + 'K';
            return sign + String(a);
        }

        // Human readable age for the live-balance badge
        function formatAge(seconds) {
            if (seconds === null || seconds === undefined || !isFinite(seconds)) return '--';
            const s = Math.max(0, Math.round(seconds));
            if (s < 5) return '刚刚更新';
            if (s < 60) return `${s} 秒前`;
            const m = Math.floor(s / 60);
            if (m < 60) return `${m} 分钟前`;
            return `${Math.floor(m / 60)} 小时前`;
        }

        // ------------------------------------------------------------------
        // Time display: EVERY time on the page is shown in Beijing time
        // (UTC+8), whatever the browser's own time zone is.
        //
        // Sources: server timestamps carry an explicit offset (the server
        // adds one to legacy naive records); nextResetTime is epoch ms. A
        // string WITHOUT an offset can still arrive through the static-file
        // fallback — the collector writes local time and the service runs in
        // China, so such a string is read as UTC+8, never as UTC or as the
        // browser's local time.
        // ------------------------------------------------------------------
        const DISPLAY_TZ = 'Asia/Shanghai';
        const NAIVE_TIME_OFFSET = '+08:00';
        const fullTimeFormat = new Intl.DateTimeFormat('zh-CN', {
            timeZone: DISPLAY_TZ, month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
        });
        const shortTimeFormat = new Intl.DateTimeFormat('zh-CN', {
            timeZone: DISPLAY_TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
        });
        const dayTimeFormat = new Intl.DateTimeFormat('zh-CN', {
            timeZone: DISPLAY_TZ, month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
        });

        // ISO string (with or without offset) or epoch ms -> Date, or null.
        function parseTime(value) {
            if (value === null || value === undefined || value === '') return null;
            if (value instanceof Date) return isNaN(value) ? null : value;
            if (typeof value === 'number') return new Date(value);
            const s = String(value);
            const hasZone = /(Z|[+-]\d{2}:?\d{2})$/i.test(s);
            const date = new Date(hasZone ? s : s + NAIVE_TIME_OFFSET);
            return isNaN(date) ? null : date;
        }

        // MM/DD HH:mm:ss in Beijing time
        function formatTime(value) {
            const date = parseTime(value);
            return date ? fullTimeFormat.format(date) : '--';
        }

        // HH:mm in Beijing time (chart labels)
        function formatShortTime(value) {
            const date = parseTime(value);
            return date ? shortTimeFormat.format(date) : '--';
        }

        // MM/DD HH:mm in Beijing time (quota reset moments)
        function formatDayTime(value) {
            const date = parseTime(value);
            return date ? dayTimeFormat.format(date) : '--';
        }

        // Format remaining time
        function formatRemaining(timestamp) {
            const now = Date.now();
            const diff = timestamp - now;
            if (diff <= 0) return '即将重置';

            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            if (hours >= 24) {
                const days = Math.floor(hours / 24);
                return `${days}天 ${hours % 24}小时`;
            }
            return `${hours}小时 ${minutes}分钟`;
        }

        // Format countdown
        function formatCountdown(seconds) {
            if (seconds <= 0) return '即将更新';
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}分${secs}秒`;
        }

        // Get progress bar color class
        function getProgressClass(percentage) {
            if (percentage < 50) return 'low';
            if (percentage < 80) return 'medium';
            return 'high';
        }

        // Update countdown display
        function updateCountdown() {
            if (!nextUpdateTime) {
                // next_update is null only until the first collection round
                // has finished for every user.
                document.getElementById('countdown').textContent =
                    lastStatus && lastStatus.user ? '首轮采集中' : '--';
                return;
            }

            const now = Date.now();
            const diff = Math.max(0, Math.floor((nextUpdateTime - now) / 1000));
            document.getElementById('countdown').textContent = formatCountdown(diff);
        }

        // Update server status
        async function updateServerStatus() {
            if (!hasServerAPI) return;

            try {
                const gen = viewGen;
                const response = await fetch(apiUrl('/api/status'));
                if (gen !== viewGen) return;
                if (response.ok) {
                    const status = await response.json();
                    if (gen !== viewGen) return;
                    lastUpdateTime = parseTime(status.last_update);
                    nextUpdateTime = parseTime(status.next_update);
                    refreshIntervalMinutes = status.refresh_interval_minutes || 15;
                    document.getElementById('refresh-interval').textContent = refreshIntervalMinutes;
                    document.getElementById('last-update').textContent = formatTime(status.last_update);
                    lastStatus = status;
                    // Paint the countdown now instead of waiting for the 1 s timer.
                    updateCountdown();
                    if (status.last_error) {
                        const dot = document.getElementById('status-dot');
                        const text = document.getElementById('status-text');
                        if (dot) dot.className = 'dot offline';
                        if (text) text.textContent = '采集异常 (' + (status.consecutive_failures || 0) + ' 次连续失败)';
                        console.warn('Collector error:', status.last_error);
                    }
                }
            } catch (e) {
                console.log('Server status not available');
            }
        }

        // ------------------------------------------------------------------
        // Live balance: one read-only upstream call behind a 60s server cache.
        // Contract with server.py GET /api/quota/live:
        //   200 { ok:true,  cached, age_seconds, ttl_seconds, fetched_at,
        //         data:{ level, limits:[...] }, error:null }
        //   502 { ok:false, cached, age_seconds, ttl_seconds, fetched_at,
        //         data:null, error:"..." }
        // ------------------------------------------------------------------
        async function refreshLiveQuota() {
            const gen = viewGen;
            liveQuotaLoading = true;
            renderFreshness();
            try {
                const response = await fetch(apiUrl('/api/quota/live', { t: Date.now() }));
                const payload = await response.json();
                if (gen !== viewGen) return;
                if (payload && payload.ok && payload.data) {
                    liveQuota = payload;
                    liveQuotaError = null;
                    liveQuotaFetchedAt = Date.now() - (payload.age_seconds || 0) * 1000;
                } else {
                    liveQuotaError = (payload && payload.error) || `HTTP ${response.status}`;
                }
            } catch (e) {
                if (gen !== viewGen) return;
                liveQuotaError = e.message || String(e);
            }
            liveQuotaLoading = false;
            applyLiveQuota();
        }

        // Swap the balance numbers in place once the live payload lands.
        // On failure we show an explicit error badge — we never fall back to 0
        // or blank, which would silently look like "you used nothing".
        function applyLiveQuota() {
            if (!contentRendered) return;
            const body = document.getElementById('quota-card-body');
            if (body && liveQuota && liveQuota.data) {
                body.innerHTML = renderQuotaLimits(liveQuota.data.limits || []);
            }
            const levelEl = document.getElementById('account-level');
            if (levelEl && liveQuota && liveQuota.data && liveQuota.data.level) {
                levelEl.textContent = String(liveQuota.data.level).toUpperCase();
            }
            const errEl = document.getElementById('quota-error');
            if (errEl) {
                if (liveQuotaError) {
                    errEl.style.display = 'block';
                    errEl.textContent = `⚠️ 实时余额获取失败（下方为最近一次采集的历史值）：${liveQuotaError}`;
                } else {
                    errEl.style.display = 'none';
                }
            }
            renderFreshness();
        }

        function renderFreshness() {
            const el = document.getElementById('quota-freshness');
            if (!el) return;
            if (liveQuotaError) {
                el.className = 'freshness error';
                el.textContent = '⚠️ 实时余额获取失败';
                return;
            }
            if (liveQuotaLoading && !liveQuota) {
                el.className = 'freshness loading';
                el.textContent = '⏳ 正在获取实时余额…';
                return;
            }
            if (!liveQuota || !liveQuotaFetchedAt) {
                el.className = 'freshness stale';
                el.textContent = '历史快照';
                return;
            }
            const ageSec = (Date.now() - liveQuotaFetchedAt) / 1000;
            el.className = 'freshness ' + (ageSec < 90 ? 'fresh' : 'stale');
            el.textContent = '🟢 ' + formatAge(ageSec);
        }

        // Force refresh
        async function forceRefresh() {
            if (isRefreshing) return;

            isRefreshing = true;
            const btn = document.getElementById('refresh-btn');
            const icon = document.getElementById('refresh-icon');

            btn.disabled = true;
            icon.innerHTML = '<span class="spinner"></span>';
            document.getElementById('status-dot').className = 'dot refreshing';
            document.getElementById('status-text').textContent = '正在更新...';

            try {
                if (hasServerAPI) {
                    // Trigger server refresh
                    const response = await fetch(apiUrl('/api/refresh'), { method: 'POST' });
                    if (response.ok) {
                        const status = await response.json();
                        lastUpdateTime = parseTime(status.last_update);
                        nextUpdateTime = parseTime(status.next_update);
                        document.getElementById('last-update').textContent = formatTime(status.last_update);
                    } else if (response.status === 429) {
                        // Server-side throttle: too soon since the last manual refresh.
                        // Not an error — show the wait and still re-read the cached data.
                        const body = await response.json().catch(() => ({}));
                        const wait = body.retry_after_seconds || body.min_interval_seconds || 60;
                        document.getElementById('status-text').textContent =
                            `刷新过于频繁，请 ${wait} 秒后重试`;
                    } else if (response.status === 409) {
                        document.getElementById('status-text').textContent = '后台正在更新，请稍候…';
                    }
                }

                // Wait a moment for data to be written
                await new Promise(resolve => setTimeout(resolve, 2000));

                // Reload data + live balance
                await Promise.all([loadData(), refreshLiveQuota(), loadOverview()]);
            } catch (e) {
                console.error('Refresh failed:', e);
            } finally {
                isRefreshing = false;
                btn.disabled = false;
                icon.innerHTML = '🔄';
            }
        }

        // Render main content
        function renderContent(data) {
            const latest = data.records[data.records.length - 1];
            const quotaLimits = latest.results.quota_limits;
            const modelUsage = latest.results.model_usage;
            const toolUsage = latest.results.tool_usage;

            // Update status bar.
            // `ok` is the new per-query flag; `success`/`code` are the legacy
            // envelope fields still present in the 100 pre-existing records.
            const isSuccess = quotaLimits?.ok ?? (quotaLimits?.success || quotaLimits?.code === 200);
            // A failing collector (from /api/status) outranks an old good record.
            if (lastStatus && lastStatus.last_error) {
                document.getElementById('status-dot').className = 'dot offline';
                document.getElementById('status-text').textContent =
                    '采集异常 (' + (lastStatus.consecutive_failures || 0) + ' 次连续失败)';
            } else {
                document.getElementById('status-dot').className = 'dot ' + (isSuccess ? 'online' : 'offline');
                document.getElementById('status-text').textContent = isSuccess ? 'API 正常' : 'API 异常';
            }
            
            if (!lastUpdateTime) {
                document.getElementById('last-update').textContent = formatTime(latest.query_time);
            }
            
            document.getElementById('account-level').textContent = (quotaLimits?.data?.level || 'MAX').toUpperCase();

            // Build HTML
            let html = '<div class="cards-grid">';
            html += renderQuotaCard(quotaLimits);
            html += renderModelCard(modelUsage);
            html += renderToolCard(toolUsage);
            html += '</div>';
            html += renderHistoryChart(data.records);

            document.getElementById('content').innerHTML = html;
            contentRendered = true;

            // If the live payload already arrived while history was rendering,
            // overwrite the historical numbers right away.
            applyLiveQuota();
        }

        // Render quota card.
        // Body is rendered from the newest HISTORY record so the page paints
        // with zero latency; applyLiveQuota() then swaps in the live numbers.
        function renderQuotaCard(quotaLimits) {
            const limits = quotaLimits?.data?.limits || quotaLimits?.limits || [];
            return `
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon quota">📊</div>
                        <div class="card-title">
                            <h2>配额限制</h2>
                            <span>Quota Limits</span>
                        </div>
                        <span class="freshness loading" id="quota-freshness">⏳ 正在获取实时余额…</span>
                    </div>
                    <div class="quota-error" id="quota-error" style="display:none"></div>
                    <div id="quota-card-body">${renderQuotaLimits(limits)}</div>
                </div>
            `;
        }

        // Which rolling window a quota entry describes: '5h', 'week' or null.
        // Mirrors zhipu_usage.quota_window(): TOKENS_LIMIT and CREDIT_LIMIT
        // share the codes unit=3,number=5 (5 hours) and unit=6,number=1
        // (1 week); unknown codes fall back to the time left until reset.
        const QUOTA_LIMIT_TYPES = ['TOKENS_LIMIT', 'CREDIT_LIMIT'];
        function quotaWindow(limit) {
            if (!limit || !QUOTA_LIMIT_TYPES.includes(limit.type)) return null;
            if (limit.unit === 3 && limit.number === 5) return '5h';
            if (limit.unit === 6 && limit.number === 1) return 'week';
            const reset = Number(limit.nextResetTime);
            if (!isFinite(reset)) return null;
            const left = reset - Date.now();
            const slack = 10 * 60 * 1000;
            if (left > 0 && left <= 5 * 3600 * 1000 + slack) return '5h';
            if (left > 0 && left <= 7 * 24 * 3600 * 1000 + slack) return 'week';
            return null;
        }

        // Render just the limit rows (shared by history render and live swap)
        function renderQuotaLimits(limits) {
            let html = '';
            const typeNames = {
                'TOKENS_LIMIT': '🎫 Token 限额',
                'CREDIT_LIMIT': '💳 额度限额',
                'TIME_LIMIT': '🔧 MCP 工具限额'
            };
            const windowNames = { '5h': '⏱️ 5小时滚动窗口', 'week': '📅 周度限额' };

            for (const limit of (limits || [])) {
                const type = limit.type;
                // Upstream values: coerce/escape before they reach innerHTML.
                const percentage = Number(limit.percentage) || 0;
                const nextReset = limit.nextResetTime;

                const window_ = quotaWindow(limit);
                const name = windowNames[window_] || typeNames[type] || escapeHtml(type);
                // CREDIT_LIMIT: usage = cap, currentValue = used
                const credit = type === 'CREDIT_LIMIT' && isFinite(Number(limit.usage))
                    ? `<span>已用: ${formatNumber(Number(limit.currentValue) || 0)} / ${formatNumber(Number(limit.usage))}</span>`
                    : '';

                html += `
                    <div class="quota-item">
                        <div class="quota-label">
                            <span class="name">${name}</span>
                            <span class="percentage">${percentage}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill ${getProgressClass(percentage)}" style="width: ${percentage}%"></div>
                        </div>
                        <div class="quota-meta">
                            <span>${nextReset ? '重置: ' + formatRemaining(nextReset) + ` (${formatDayTime(nextReset)})` : ''}</span>
                            ${credit}
                            ${type === 'TIME_LIMIT' ? `<span>剩余: ${formatNumber(limit.remaining || 0)}</span>` : ''}
                        </div>
                    </div>
                `;
            }

            if (!html) {
                html = '<div class="quota-meta"><span>暂无配额数据</span></div>';
            }
            return html;
        }

        // Render model card
        function renderModelCard(modelUsage) {
            const data = modelUsage?.data || modelUsage;
            const total = data?.totalUsage || {};
            const totalCalls = total.totalModelCallCount || 0;
            const totalTokens = total.totalTokensUsage || 0;

            return `
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon model">🤖</div>
                        <div class="card-title">
                            <h2>模型使用 (24h)</h2>
                            <span>Model Usage</span>
                        </div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value blue">${formatNumber(totalCalls)}</div>
                            <div class="stat-label">调用次数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value purple">${formatNumber(totalTokens)}</div>
                            <div class="stat-label">Token 使用</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value green">${totalCalls > 0 ? (totalTokens / totalCalls).toFixed(0) : 0}</div>
                            <div class="stat-label">平均 Tokens/调用</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value orange">${Math.floor(totalTokens / 1000000 * 100) / 100}</div>
                            <div class="stat-label">百万 Tokens</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render tool card
        function renderToolCard(toolUsage) {
            const data = toolUsage?.data || toolUsage;
            const total = data?.totalUsage || {};
            const details = total.toolDetails || [];

            let toolsHtml = '';
            const icons = {
                'search-prime': '🔍',
                'web-reader': '📖',
                'zread': '📚'
            };

            for (const tool of details) {
                const icon = icons[tool.modelName] || '🔧';
                const toolName = escapeHtml(tool.modelName);
                toolsHtml += `
                    <div class="tool-item">
                        <div class="tool-name">
                            <span class="icon">${icon}</span>
                            <span>${toolName}</span>
                        </div>
                        <span class="tool-count">${formatNumber(tool.totalUsageCount)}</span>
                    </div>
                `;
            }

            return `
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon tool">🔧</div>
                        <div class="card-title">
                            <h2>工具使用 (24h)</h2>
                            <span>Tool Usage</span>
                        </div>
                    </div>
                    <div class="tool-list">
                        <div class="tool-item">
                            <div class="tool-name">
                                <span class="icon">📊</span>
                                <span>总调用</span>
                            </div>
                            <span class="tool-count">${formatNumber(total.totalSearchMcpCount || 0)}</span>
                        </div>
                        ${toolsHtml}
                    </div>
                </div>
            `;
        }

        // Pull the 24h rolling cumulative token total out of one record.
        // Returns null when that record has no usable model-usage data, so the
        // chart can skip it instead of pretending it was 0.
        function recordCumulative(record) {
            const mu = record?.results?.model_usage;
            if (!mu) return null;
            // New records carry ok:false on failure; legacy ones have no flag.
            if (mu.ok === false) return null;
            const data = mu.data || mu;
            const total = data?.totalUsage?.totalTokensUsage;
            if (typeof total !== 'number' || !isFinite(total)) return null;
            return total;
        }

        // Render history chart — DUAL AXIS.
        //
        // The upstream figure is a 24h ROLLING total, so plotting it directly as
        // bars drew a flat line. Now:
        //   bars  (left axis)  = delta between two consecutive records, i.e. the
        //                        real consumption inside one 15-minute interval
        //   line  (right axis) = the original cumulative 24h total
        // A missing previous value, a skipped/failed record, or a negative delta
        // (the rolling window slid old traffic out) is drawn as a hatched
        // "no data" bar — never as a 0 bar and never as a negative bar.
        function renderHistoryChart(records) {
            const recent = records.slice(-20);

            const points = recent.map(r => ({
                label: formatShortTime(r.query_time),
                cumulative: recordCumulative(r),
                partial: r?.partial === true
            }));

            // Delta needs the record right before the window too, when available
            const priorIndex = records.length - recent.length - 1;
            let prevCumulative = priorIndex >= 0 ? recordCumulative(records[priorIndex]) : null;

            for (const p of points) {
                if (p.cumulative === null || prevCumulative === null) {
                    p.delta = null;              // no baseline -> skip, not 0
                } else {
                    const d = p.cumulative - prevCumulative;
                    p.delta = d < 0 ? null : d;  // window slid out -> treat as missing
                }
                if (p.cumulative !== null) prevCumulative = p.cumulative;
            }

            const deltas = points.map(p => p.delta).filter(v => v !== null);
            const cums = points.map(p => p.cumulative).filter(v => v !== null);
            const maxDelta = deltas.length ? Math.max(...deltas, 1) : 1;
            const maxCum = cums.length ? Math.max(...cums, 1) : 1;

            let barsHtml = '';
            for (const p of points) {
                if (p.delta === null) {
                    barsHtml += `<div class="chart-bar missing" title="${escapeHtml(p.label)} 无增量数据"></div>`;
                } else {
                    const height = Math.max(2, (p.delta / maxDelta) * 100);
                    barsHtml += `<div class="chart-bar" style="height: ${height}%" data-value="${formatNumber(p.delta)}"></div>`;
                }
            }

            // Cumulative polyline on the secondary axis (percent viewBox so it
            // stretches with the container; no chart library needed).
            const n = points.length;
            const segs = [];
            let current = [];
            for (let i = 0; i < n; i++) {
                const c = points[i].cumulative;
                if (c === null) {
                    if (current.length > 1) segs.push(current);
                    current = [];
                    continue;
                }
                const x = n === 1 ? 50 : (i / (n - 1)) * 100;
                const y = 100 - (c / maxCum) * 100;
                current.push(`${x.toFixed(2)},${y.toFixed(2)}`);
            }
            if (current.length > 1) segs.push(current);
            const lineHtml = segs
                .map(seg => `<polyline points="${seg.join(' ')}" fill="none" stroke="#f59e0b" stroke-width="1.5" vector-effect="non-scaling-stroke" />`)
                .join('');

            let labelsHtml = '';
            for (const p of points) {
                labelsHtml += `<span>${escapeHtml(p.label.split(' ')[1] || p.label)}</span>`;
            }

            return `
                <div class="history-section">
                    <div class="history-header">
                        <h2>📈 Token 使用趋势</h2>
                        <span style="color: #888">最近 ${records.length} 次查询</span>
                    </div>
                    <div class="chart-container">
                        <div class="chart-wrap">
                            <div class="chart-axis left">
                                <span class="axis-title">增量<br>${formatNumber(maxDelta)}</span>
                                <span>0</span>
                            </div>
                            <div>
                                <div class="chart">
                                    ${barsHtml}
                                    <svg class="chart-line-svg" viewBox="0 0 100 100" preserveAspectRatio="none">${lineHtml}</svg>
                                </div>
                                <div class="chart-labels">
                                    ${labelsHtml}
                                </div>
                            </div>
                            <div class="chart-axis right">
                                <span class="axis-title">累计24h<br>${formatNumber(maxCum)}</span>
                                <span>0</span>
                            </div>
                        </div>
                        <div class="chart-legend">
                            <span><i class="swatch bar"></i>柱状：区间增量（左轴）</span>
                            <span><i class="swatch line"></i>折线：24h 累计总量（右轴）</span>
                            <span><i class="swatch missing"></i>斜纹：该区间无有效增量</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render error
        function renderError(message) {
            document.getElementById('status-dot').className = 'dot offline';
            document.getElementById('status-text').textContent = '加载失败';

            document.getElementById('content').innerHTML = `
                <div class="error-message">
                    <h2>❌ 加载失败</h2>
                    <p>${escapeHtml(message)}</p>
                    <button class="btn" onclick="forceRefresh()">重新加载</button>
                </div>
            `;
        }

        // Load data. Tries the server API first and falls back to the static
        // JSON file, so it no longer has to wait for detectServerAPI().
        async function loadData() {
            const gen = viewGen;
            try {
                let response = await fetch(apiUrl('/api/history', { t: Date.now() })).catch(() => null);
                // The static-file fallback only exists for the single legacy
                // file, i.e. the first (default) user.
                const isDefaultUser = !currentUser || (users[0] && users[0].name === currentUser);
                if ((!response || !response.ok) && !isDefaultUser) {
                    let detail = '';
                    try {
                        const body = response ? await response.json() : null;
                        if (body && body.error) detail = `：${body.error}`;
                    } catch (e) { /* not JSON */ }
                    throw new Error('无法加载该用户的历史数据' + detail);
                }
                if (!response || !response.ok) {
                    let detail = '';
                    if (response) {
                        try {
                            const body = await response.clone().json();
                            if (body && body.error) detail = `：${body.error}`;
                        } catch (e) { /* not JSON */ }
                    }
                    response = await fetch(`${JSON_FILE}?t=${Date.now()}`).catch(() => null);
                    if (!response || !response.ok) throw new Error('无法加载数据文件' + detail);
                }

                const data = await response.json();
                if (gen !== viewGen) return;
                if (!data.records || data.records.length === 0) {
                    throw new Error('没有可用的历史记录' + (data.error ? `：${data.error}` : ''));
                }

                renderContent(data);
            } catch (error) {
                if (gen !== viewGen) return;
                renderError(error.message);
            }
        }

        // ------------------------------------------------------------------
        // Multi-user: user list, overview table, switching
        // ------------------------------------------------------------------
        async function loadUsers() {
            try {
                const response = await fetch(`${API_BASE}/api/users`);
                if (!response.ok) return;
                const body = await response.json();
                users = Array.isArray(body.users) ? body.users : [];
                (body.config_errors || []).forEach(e => console.warn('Config:', e));
            } catch (e) {
                users = [];
            }
            const names = users.map(u => u.name);
            const requested = new URLSearchParams(location.search).get('user');
            if (requested && names.includes(requested)) {
                currentUser = requested;
            } else {
                currentUser = names[0] || null;
                if (requested) syncUrl(true);   // unknown ?user= -> drop it
            }
            renderUserTabs();
        }

        function syncUrl(replace) {
            const url = new URL(location.href);
            const isDefault = !currentUser || (users[0] && users[0].name === currentUser);
            if (isDefault) url.searchParams.delete('user');
            else url.searchParams.set('user', currentUser);
            if (url.href === location.href) return;
            if (replace) history.replaceState(null, '', url);
            else history.pushState(null, '', url);
        }

        function rowFor(name) {
            return overviewRows.find(r => r.user === name);
        }

        function renderUserTabs() {
            const el = document.getElementById('user-tabs');
            if (users.length < 2) {
                el.style.display = 'none';
                return;
            }
            el.style.display = 'flex';
            el.innerHTML = users.map(u => {
                const row = rowFor(u.name);
                const bad = row && (row.healthy === false || row.history_error);
                return `<button class="user-tab ${u.name === currentUser ? 'active' : ''}"
                            data-user="${escapeHtml(u.name)}">
                            <span class="tab-dot ${bad ? 'bad' : ''}"></span>${escapeHtml(u.name)}
                        </button>`;
            }).join('');
            el.querySelectorAll('.user-tab').forEach(btn => {
                btn.addEventListener('click', () => selectUser(btn.dataset.user));
            });
        }

        function pctCell(value) {
            if (value === null || value === undefined || !isFinite(Number(value))) {
                return '<td class="muted">--</td>';
            }
            return `<td class="pct ${getProgressClass(Number(value))}">${escapeHtml(value)}%</td>`;
        }

        function renderOverview() {
            const section = document.getElementById('overview');
            if (users.length < 2) {
                section.style.display = 'none';
                return;
            }
            section.style.display = 'block';
            const body = document.getElementById('overview-body');
            body.innerHTML = overviewRows.map(r => {
                const err = r.history_error || (r.healthy === false ? '采集异常' : '');
                return `
                    <tr data-user="${escapeHtml(r.user)}" class="${r.user === currentUser ? 'active' : ''}"
                        title="${escapeHtml(r.last_error || r.history_error || '')}">
                        <td><strong>${escapeHtml(r.user)}</strong>${err ? `<span class="row-error">⚠️<span class="err-text"> ${escapeHtml(err)}</span></span>` : ''}</td>
                        ${pctCell(r.five_hour_pct)}
                        ${pctCell(r.weekly_pct)}
                        <td>${formatNumber(r.tokens_24h)}</td>
                        <td class="hide-mobile">${r.level ? escapeHtml(String(r.level).toUpperCase()) : '--'}</td>
                        <td class="hide-mobile muted">${formatTime(r.record_time)}</td>
                    </tr>`;
            }).join('');
            body.querySelectorAll('tr[data-user]').forEach(tr => {
                tr.addEventListener('click', () => selectUser(tr.dataset.user));
            });
        }

        async function loadOverview() {
            if (users.length < 2) {
                renderOverview();
                return;
            }
            try {
                const response = await fetch(`${API_BASE}/api/overview?t=${Date.now()}`);
                if (!response.ok) return;
                const body = await response.json();
                overviewRows = Array.isArray(body.users) ? body.users : [];
            } catch (e) {
                console.warn('Overview not available');
            }
            renderOverview();
            renderUserTabs();
        }

        // Reset every per-user piece of page state, then reload for the new user.
        function resetUserView() {
            viewGen += 1;
            liveQuota = null;
            liveQuotaError = null;
            liveQuotaFetchedAt = null;
            liveQuotaLoading = true;
            contentRendered = false;
            lastUpdateTime = null;
            nextUpdateTime = null;
            lastStatus = null;
            document.getElementById('last-update').textContent = '--';
            document.getElementById('countdown').textContent = '--';
            document.getElementById('account-level').textContent = '--';
            document.getElementById('status-dot').className = 'dot';
            document.getElementById('status-text').textContent = '加载中...';
            document.getElementById('content').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在加载 ${escapeHtml(currentUser || '')} 的数据...</p>
                </div>`;
        }

        async function selectUser(name, fromHistory) {
            if (!users.some(u => u.name === name) || name === currentUser) return;
            currentUser = name;
            if (!fromHistory) syncUrl(false);
            resetUserView();
            renderUserTabs();
            renderOverview();
            await Promise.allSettled([loadData(), refreshLiveQuota(), updateServerStatus()]);
        }

        window.addEventListener('popstate', () => {
            const requested = new URLSearchParams(location.search).get('user');
            const target = requested && users.some(u => u.name === requested)
                ? requested : (users[0] && users[0].name);
            if (target) selectUser(target, true);
        });

        // Initialize.
        // History paints the page immediately (0 latency) while the live
        // balance request runs concurrently and replaces the numbers on arrival.
        async function init() {
            // Timers start right away: the countdown must not sit on '--'
            // while a slow live-quota request is still pending.
            countdownTimer = setInterval(updateCountdown, 1000);
            freshnessTimer = setInterval(renderFreshness, 1000);

            // The user list decides which ?user= every other call carries.
            await loadUsers();
            const overviewPromise = loadOverview();
            const historyPromise = loadData();
            const livePromise = refreshLiveQuota();

            detectServerAPI().then(() => {
                console.log('Server API available:', hasServerAPI);
                return updateServerStatus();
            });

            await Promise.allSettled([historyPromise, livePromise, overviewPromise]);

            // Live balance stays fresh on its own cadence (server caches 60s)
            setInterval(refreshLiveQuota, 60000);

            // Overview table: local server state only, no upstream calls
            setInterval(loadOverview, 60000);

            // Auto refresh history / trend data
            setInterval(async () => {
                await updateServerStatus();
                await loadData();
            }, REFRESH_INTERVAL);
        }

        init();
    </script>
</body>
</html>
